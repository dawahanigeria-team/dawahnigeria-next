# Runs on `pull_request`, deliberately NOT `pull_request_target`: fork PRs get
# checks without any access to repository secrets.
name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 22.13 is the floor for the pinned pnpm, which needs node:sqlite.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # No .env.local is created on purpose. The committed .env.production
      # carries everything lib/env.ts requires, so this build runs under exactly
      # the same conditions as Cloudflare Workers Builds and a contributor's
      # fresh clone. If this step needs a secret to pass, the build is broken for
      # forks too.
      - run: pnpm build
