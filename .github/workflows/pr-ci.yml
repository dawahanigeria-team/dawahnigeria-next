# Runs on `pull_request`, deliberately NOT `pull_request_target`: fork PRs get
# checks without any access to repository secrets.
name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22.13 is the floor for the pinned pnpm, which needs node:sqlite.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # The exact step CONTRIBUTING tells a new contributor to run. .env.example
      # holds only public values, so this keeps CI in the same position as a
      # first-time contributor: a green build here means a fresh clone builds.
      # lib/env.ts hard-fails on a missing API_BASE_URL, which lives only here.
      - run: cp .env.example .env.local

      - run: pnpm build
